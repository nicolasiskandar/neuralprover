base_model: "HuggingFaceTB/SmolLM2-135M"
revision: "4e53f736cbb20a9a0f56b4c4bf378d9f306ff915" # Hugging Face immutable commit
sequence_length: 1024
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
training:
  epochs: 1
  learning_rate: 0.0002
  batch_size: 1
  seed: 17
  output_dir: experiments/smol-lora
  # -1 means "as many steps as the epochs need"; a budget of 0 would end the
  # run after its first step.
  max_steps: -1
  # Only train on rows whose mined goal state is the proof-global goal list,
  # which is the state the live client reports.
  goal_scope: proof
