[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralproof"
version = "0.1.0"
description = "Research infrastructure for neural Lean 4 theorem proving"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.6.0; python_version < '3.13'", "transformers==4.49.0; python_version < '3.13'", "peft==0.14.0; python_version < '3.13'", "datasets==3.3.2; python_version < '3.13'", "pyyaml==6.0.2; python_version < '3.13'"]
test = ["pytest==9.1.1"]

[project.scripts]
neuralproof = "neuralproof.cli:main"

[tool.setuptools.packages.find]
include = ["neuralproof*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
  "lean: needs the pinned Lean toolchain; the test runs `lake env lean`",
  "corpus: needs a corpus that is checked out under data/",
  "model: needs torch, transformers and a local model cache",
  "slow: takes more than a few seconds",
]
